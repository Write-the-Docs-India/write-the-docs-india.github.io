title: Write the Docs India
description: >-
  The India chapter of Write the Docs, for people who write and look after
  documentation.
url: https://writethedocs-india.github.io
baseurl: ""
lang: en-IN
timezone: Asia/Kolkata

logo: /assets/img/write-the-docs-india-logo.png
social:
  name: Write the Docs India
  links:
    - https://www.linkedin.com/company/write-the-docs-india
    - https://github.com/writethedocs-india

# Community links, used across the site
links:
  whatsapp: https://chat.whatsapp.com/EwspIErzCWQ4SI4MXKB4D0?mode=gi_t
  linkedin: https://www.linkedin.com/company/write-the-docs-india
  meetup: https://www.meetup.com/write-the-docs-india/
  slack_invite: https://www.writethedocs.org/slack/
  slack_channel: "#india"
  github: https://github.com/writethedocs-india
  repo: https://github.com/writethedocs-india/writethedocs-india.github.io
  talk_proposal: https://github.com/writethedocs-india/writethedocs-india.github.io/issues/new?template=talk-proposal.yml
  coc: https://www.writethedocs.org/code-of-conduct/
  coc_meetups: https://www.writethedocs.org/code-of-conduct-shortform-meetups/
  coc_email: conduct@writethedocs.org
  wtd: https://www.writethedocs.org/
  principles: https://www.writethedocs.org/about-us/
  starting_guide: https://www.writethedocs.org/organizer-guide/meetups/starting/

# Regular meetup slot, e.g. "second Saturday of the month, 11:00 IST".
# Leave empty until the organisers agree on one; the homepage hides it when blank.
cadence: ""

permalink: /debriefs/:year/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: debriefs/feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
