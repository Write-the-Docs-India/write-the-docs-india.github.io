<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/write-the-docs-india-logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/write-the-docs-india-logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Kalam&family=Martel:wght@400;600;700&family=Martel+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="wtdi-skip" href="#main">Skip to content</a>

  <div class="wtdi-rule wtdi-rule--saffron" aria-hidden="true"></div>

  <main id="main">
    {{ content }}
  </main>

  <footer class="wtdi-footer">
    <div class="wtdi-page wtdi-footer__inner">
      <p>
        We're the India chapter of
        <a href="{{ site.links.wtd }}">Write the Docs</a>
        and follow its <a href="{{ site.links.coc }}">Code of Conduct</a>.
      </p>
      <ul class="wtdi-footer__links">
        <li><a href="{{ '/debriefs/' | relative_url }}">Debriefs</a></li>
        <li><a href="{{ site.links.whatsapp }}">WhatsApp</a></li>
        <li><a href="{{ site.links.linkedin }}">LinkedIn</a></li>
        <li><a href="{{ site.links.meetup }}">Meetup</a></li>
        <li><a href="{{ '/debriefs/feed.xml' | relative_url }}">RSS</a></li>
        <li><a href="{{ site.links.repo }}">Source</a></li>
      </ul>
    </div>
    <div class="wtdi-rule wtdi-rule--green" aria-hidden="true"></div>
  </footer>
</body>
</html>
